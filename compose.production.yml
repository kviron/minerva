name: minerva-production

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL_FILE: /run/secrets/database_url
  BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
  BETTER_AUTH_URL: https://${MINERVA_DOMAIN:?MINERVA_DOMAIN is required}
  MCP_RESOURCE_URL: https://${MINERVA_DOMAIN:?MINERVA_DOMAIN is required}/mcp
  TRUSTED_ORIGINS: https://${MINERVA_DOMAIN:?MINERVA_DOMAIN is required}
  RATE_LIMIT_HMAC_SECRET_FILE: /run/secrets/rate_limit_hmac_secret
  TRUST_PROXY: "true"
  SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
  SMTP_PORT: ${SMTP_PORT:-587}
  MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
  CREDENTIAL_ENCRYPTION_ACTIVE_KEY_VERSION: ${CREDENTIAL_ENCRYPTION_ACTIVE_KEY_VERSION:?CREDENTIAL_ENCRYPTION_ACTIVE_KEY_VERSION is required}
  CREDENTIAL_ENCRYPTION_KEYS_FILE: /run/secrets/credential_encryption_keys
  S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
  S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}

x-app-secrets: &app-secrets
  - database_url
  - better_auth_secret
  - rate_limit_hmac_secret
  - credential_encryption_keys
  - s3_access_key_id
  - s3_secret_access_key

x-hardened-app: &hardened-app
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
  init: true
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  deploy:
    resources:
      limits:
        cpus: "1.00"
        memory: 768M

services:
  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      MINERVA_DOMAIN: ${MINERVA_DOMAIN:?MINERVA_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
      - backend
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  migrate:
    <<: *hardened-app
    image: ${MINERVA_IMAGE:?MINERVA_IMAGE is required}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "migrate.mjs"]
    restart: "no"
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *hardened-app
    image: ${MINERVA_IMAGE:?MINERVA_IMAGE is required}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *app-environment
    secrets: *app-secrets
    networks:
      - backend
      - egress
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "const response = await fetch('http://127.0.0.1:3000/api/health/ready'); process.exit(response.ok ? 0 : 1)"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s

  backup:
    <<: *hardened-app
    profiles: [backup]
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    image: ${MINERVA_BACKUP_IMAGE:-minerva-backup:local}
    command: ["/opt/minerva/backup.sh"]
    restart: "no"
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      BACKUP_REPOSITORY_FILE: /run/secrets/backup_repository
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      BACKUP_ACCESS_KEY_ID_FILE: /run/secrets/backup_access_key_id
      BACKUP_SECRET_ACCESS_KEY_FILE: /run/secrets/backup_secret_access_key
      APP_IMAGE_DIGEST: ${MINERVA_IMAGE_DIGEST:?MINERVA_IMAGE_DIGEST is required}
      REQUIRED_MIGRATION_CREATED_AT: ${REQUIRED_MIGRATION_CREATED_AT:?REQUIRED_MIGRATION_CREATED_AT is required}
      BACKUP_MIN_FREE_KIB: ${BACKUP_MIN_FREE_KIB:-1048576}
    secrets:
      - database_url
      - backup_repository
      - restic_password
      - backup_access_key_id
      - backup_secret_access_key
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
      - /backup-stage:size=${BACKUP_STAGE_SIZE:-2g},mode=0700,uid=70,gid=70,nosuid,nodev
    networks:
      - backend
      - egress
    depends_on:
      postgres:
        condition: service_healthy

  backup-check:
    <<: *hardened-app
    profiles: [backup-check]
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    image: ${MINERVA_BACKUP_IMAGE:-minerva-backup:local}
    command: ["/opt/minerva/check.sh"]
    restart: "no"
    environment:
      BACKUP_REPOSITORY_FILE: /run/secrets/backup_repository
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      BACKUP_ACCESS_KEY_ID_FILE: /run/secrets/backup_access_key_id
      BACKUP_SECRET_ACCESS_KEY_FILE: /run/secrets/backup_secret_access_key
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-86400}
    secrets:
      - backup_repository
      - restic_password
      - backup_access_key_id
      - backup_secret_access_key
    networks:
      - egress

  backup-preflight:
    <<: *hardened-app
    profiles: [backup-preflight]
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    image: ${MINERVA_BACKUP_IMAGE:-minerva-backup:local}
    command: ["/opt/minerva/preflight.sh"]
    restart: "no"
    environment:
      BACKUP_REPOSITORY_FILE: /run/secrets/backup_repository
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      BACKUP_ACCESS_KEY_ID_FILE: /run/secrets/backup_access_key_id
      BACKUP_SECRET_ACCESS_KEY_FILE: /run/secrets/backup_secret_access_key
      OBJECT_AUDIT_ACCESS_KEY_ID_FILE: /run/secrets/object_audit_access_key_id
      OBJECT_AUDIT_SECRET_ACCESS_KEY_FILE: /run/secrets/object_audit_secret_access_key
      APP_IMAGE_DIGEST: ${MINERVA_IMAGE_DIGEST:?MINERVA_IMAGE_DIGEST is required}
      REQUIRED_MIGRATION_CREATED_AT: ${REQUIRED_MIGRATION_CREATED_AT:?REQUIRED_MIGRATION_CREATED_AT is required}
      PRODUCTION_S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      PRODUCTION_S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      BACKUP_MIN_FREE_KIB: ${BACKUP_MIN_FREE_KIB:-1048576}
    secrets:
      - backup_repository
      - restic_password
      - backup_access_key_id
      - backup_secret_access_key
      - object_audit_access_key_id
      - object_audit_secret_access_key
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
      - /backup-stage:size=${BACKUP_STAGE_SIZE:-2g},mode=0700,uid=70,gid=70,nosuid,nodev
    networks:
      - egress

  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: minerva
      POSTGRES_USER: minerva
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minerva -d minerva"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M

networks:
  edge:
  backend:
    internal: true
  egress:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

secrets:
  database_url:
    file: ${DATABASE_URL_SECRET_FILE:-./secrets/database_url}
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:-./secrets/postgres_password}
  better_auth_secret:
    file: ${BETTER_AUTH_SECRET_FILE:-./secrets/better_auth_secret}
  rate_limit_hmac_secret:
    file: ${RATE_LIMIT_HMAC_SECRET_FILE:-./secrets/rate_limit_hmac_secret}
  credential_encryption_keys:
    file: ${CREDENTIAL_ENCRYPTION_KEYS_FILE:-./secrets/credential_encryption_keys}
  s3_access_key_id:
    file: ${S3_ACCESS_KEY_ID_FILE:-./secrets/s3_access_key_id}
  s3_secret_access_key:
    file: ${S3_SECRET_ACCESS_KEY_FILE:-./secrets/s3_secret_access_key}
  backup_repository:
    file: ${BACKUP_REPOSITORY_FILE:-./secrets/backup_repository}
  restic_password:
    file: ${RESTIC_PASSWORD_FILE:-./secrets/restic_password}
  backup_access_key_id:
    file: ${BACKUP_ACCESS_KEY_ID_FILE:-./secrets/backup_access_key_id}
  backup_secret_access_key:
    file: ${BACKUP_SECRET_ACCESS_KEY_FILE:-./secrets/backup_secret_access_key}
  object_audit_access_key_id:
    file: ${OBJECT_AUDIT_ACCESS_KEY_ID_FILE:-./secrets/object_audit_access_key_id}
  object_audit_secret_access_key:
    file: ${OBJECT_AUDIT_SECRET_ACCESS_KEY_FILE:-./secrets/object_audit_secret_access_key}
